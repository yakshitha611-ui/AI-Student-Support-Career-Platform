<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | AI-Powered Student Support</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eaf3ff;
      --sky-light: #edf7ff;
      --sky-mid: #dfeefe;
      --sky-deep: #b6d8ff;
      --bg: linear-gradient(135deg, #eef7ff 0%, #dfeeff 35%, #f8fbff 100%);
      --card-bg: rgba(255, 255, 255, 0.8);
      --glass: rgba(255, 255, 255, 0.65);
      --text: #10233d;
      --text-muted: #58708f;
      --border: rgba(144, 176, 220, 0.25);
      --shadow-soft: 12px 12px 28px rgba(122, 156, 204, 0.18), -12px -12px 24px rgba(255, 255, 255, 0.8);
      --shadow-inset: inset 4px 4px 10px rgba(173, 197, 255, 0.22), inset -4px -4px 10px rgba(255, 255, 255, 0.8);
      --nav-shadow: 10px 10px 24px rgba(78, 124, 201, 0.16), -6px -6px 18px rgba(255, 255, 255, 0.7);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* TOPBAR */
    .topbar {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 20px rgba(144, 171, 217, 0.12);
      flex-shrink: 0;
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      letter-spacing: 0.02em;
    }

    .logout-button {
      background: linear-gradient(135deg, #2d7af6 0%, #1f5fe2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 10px 20px rgba(51, 114, 226, 0.2);
      transition: transform 0.18s ease, box-shadow 0.2s ease;
    }

    .logout-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(51, 114, 226, 0.28);
    }

    .hamburger {
      display: none;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text);
    }

    /* MAIN CONTAINER */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding: 1.2rem;
      gap: 1.2rem;
    }

    /* LEFT SIDEBAR */
    .sidebar {
      width: 290px;
      background: linear-gradient(180deg, rgba(250, 252, 255, 0.95) 0%, rgba(228, 240, 255, 0.92) 100%);
      border: 1px solid var(--border);
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--nav-shadow);
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1.4rem 1.3rem 1.1rem;
      border-bottom: 1px solid rgba(142, 176, 226, 0.18);
      font-weight: 700;
      color: var(--text);
      font-size: 0.86rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.18);
    }

    .sidebar-close {
      display: none;
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text);
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      padding: 1rem 1.1rem;
      background: linear-gradient(145deg, #edf6ff 0%, #dfeeff 100%);
      border: 1px solid rgba(148, 176, 228, 0.2);
      border-radius: 18px;
      color: var(--text);
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      text-align: left;
      box-shadow: 7px 7px 16px rgba(140, 166, 208, 0.18), -6px -6px 14px rgba(255, 255, 255, 0.8);
    }

    .menu-item:hover {
      transform: translateY(-1px);
      color: var(--primary);
      box-shadow: 9px 9px 18px rgba(140, 166, 208, 0.2), -6px -6px 14px rgba(255, 255, 255, 0.9);
    }

    .menu-item.active {
      background: linear-gradient(145deg, #edf5ff 0%, #dceeff 100%);
      color: var(--primary-dark);
      border-color: rgba(37, 99, 235, 0.38);
      box-shadow: inset 2px 2px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 12px rgba(112, 158, 244, 0.12), 12px 12px 22px rgba(89, 126, 200, 0.18);
      transform: translateY(-1px);
    }

    .menu-item-icon {
      font-size: 1.2rem;
      width: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-item-text {
      flex: 1;
      line-height: 1.4;
    }

    /* CONTENT AREA */
    .content-area {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.32) 0%, rgba(232, 243, 255, 0.5) 100%);
      border: 1px solid rgba(154, 184, 233, 0.22);
      border-radius: 28px;
      box-shadow: var(--shadow-soft);
      min-width: 0;
    }

    /* SECTION CONTAINER */
    .section-container {
      flex: 1;
      overflow-y: auto;
      display: none;
      padding: 2rem 1.5rem;
      background: linear-gradient(180deg, rgba(245, 250, 255, 0.55) 0%, rgba(222, 237, 255, 0.35) 100%);
    }

    .section-container.active {
      display: block;
    }

    /* WELCOME SECTION */
    .welcome-section {
      background: linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(223, 239, 255, 0.95) 100%);
      border: 1px solid rgba(148, 181, 235, 0.22);
      border-radius: 22px;
      padding: 2.5rem;
      box-shadow: 18px 18px 28px rgba(125, 154, 200, 0.15), inset 1px 1px 0 rgba(255,255,255,0.85), inset -8px -8px 18px rgba(186, 210, 247, 0.12);
      margin-bottom: 2rem;
    }

    .welcome-label {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .user-name {
      font-size: 2.2rem;
      margin: 0.8rem 0 0;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .proverb {
      margin-top: 1.2rem;
      padding: 1rem 1.5rem;
      background: linear-gradient(135deg, rgba(240, 252, 245, 0.85) 0%, rgba(220, 252, 235, 0.9) 100%);
      border-left: 4px solid #19a76f;
      border-radius: 12px;
      color: #166534;
      font-size: 0.98rem;
      font-style: italic;
      line-height: 1.6;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.8);
    }

    .status-message {
      margin-top: 1rem;
      padding: 0.9rem 1rem;
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.9) 0%, rgba(214, 249, 229, 0.85) 100%);
      color: #166534;
      border-radius: 12px;
      font-size: 0.9rem;
      border: 1px solid rgba(51, 169, 118, 0.12);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.7);
    }

    .status-message.error {
      background: linear-gradient(135deg, rgba(254, 242, 242, 0.9) 0%, rgba(252, 232, 232, 0.9) 100%);
      color: #991b1b;
      border-left: 4px solid #dc2626;
    }

    /* IFRAME CONTAINER */
    .iframe-container {
      flex: 1;
      overflow: hidden;
      background: rgba(255,255,255,0.18);
      border-radius: 0 0 28px 28px;
    }

    .feature-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: white;
    }

    .feature-iframe.active {
      display: block;
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .sidebar {
        width: 240px;
      }

      .topbar {
        padding: 1rem 1.5rem;
      }
    }

    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }

      .main-container {
        flex-direction: row;
      }

      .sidebar {
        width: 100%;
        max-height: 0;
        overflow: hidden;
        border-right: none;
        border-top: 1px solid var(--border);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: auto;
        z-index: 999;
      }

      .sidebar.open {
        max-height: 100vh;
        position: fixed;
        top: 60px;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 999;
        overflow-y: auto;
      }

      .sidebar.open .sidebar-close {
        display: block;
      }

      .sidebar-header {
        display: none;
      }

      .sidebar.open .sidebar-header {
        display: block;
        padding: 1rem;
        border-bottom: 1px solid var(--border);
      }

      .sidebar.open {
        background: rgba(255, 255, 255, 0.98);
      }

      .section-container {
        padding: 1.5rem 1rem;
      }

      .welcome-section {
        padding: 1.5rem;
      }

      .user-name {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 0.8rem 1rem;
      }

      .brand {
        font-size: 0.95rem;
      }

      .logout-button {
        padding: 0.5rem 0.8rem;
        font-size: 0.85rem;
      }

      .welcome-section {
        padding: 1.2rem;
      }

      .user-name {
        font-size: 1.5rem;
      }

      .proverb {
        font-size: 0.85rem;
        padding: 0.8rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand">AI-Powered Student Support</div>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">☰</button>
      <button class="logout-button" id="logoutButton">Logout</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="main-container">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>
      <div class="sidebar-header">Features</div>
      <nav class="sidebar-menu">
        <button type="button" class="menu-item active" data-section="welcome">
          <span class="menu-item-text">Dashboard</span>
        </button>
        <button type="button" class="menu-item" data-section="student-profile">
          <span class="menu-item-text">Student Profile</span>
        </button>
        <button type="button" class="menu-item" data-section="skill-intelligence">
          <span class="menu-item-text">Skill Intelligence</span>
        </button>
        <button type="button" class="menu-item" data-section="courses">
          <span class="menu-item-text">Recommended Courses</span>
        </button>
        <button type="button" class="menu-item" data-section="learning-roadmap">
          <span class="menu-item-text">My Learning Roadmap</span>
        </button>
        <button type="button" class="menu-item" data-section="learning-plan">
          <span class="menu-item-text">My Learning Plan</span>
        </button>
        <button type="button" class="menu-item" data-section="learning-progress">
          <span class="menu-item-text">Learning Progress</span>
        </button>
        <button type="button" class="menu-item" data-section="skill-recommendations">
          <span class="menu-item-text">Next Best Skill</span>
        </button>
        <button type="button" class="menu-item" data-section="chat">
          <span class="menu-item-text">AI Student & Career Chatbox</span>
        </button>
      </nav>
    </aside>

    <!-- CONTENT AREA (RIGHT) -->
    <div class="content-area">
      <!-- WELCOME SECTION -->
      <div class="section-container active" id="welcomeSection">
        <div class="welcome-section">
          <div class="welcome-label">Dashboard</div>
          <h1 class="user-name" id="userName">Welcome, Student</h1>
          <div class="proverb" id="proverb">
            "The beautiful thing about learning is that no one can take it away from you."
          </div>
          <div id="statusMessage" class="status-message">Loading your profile...</div>
        </div>
      </div>

      <!-- FEATURE IFRAMES -->
      <div class="iframe-container">
        <iframe id="studentProfileFrame" class="feature-iframe" title="Student Profile"></iframe>
        <iframe id="skillIntelligenceFrame" class="feature-iframe" title="Skill Intelligence"></iframe>
        <iframe id="coursesFrame" class="feature-iframe" title="Recommended Courses"></iframe>
        <iframe id="learningRoadmapFrame" class="feature-iframe" title="My Learning Roadmap"></iframe>
        <iframe id="learningPlanFrame" class="feature-iframe" title="My Learning Plan"></iframe>
        <iframe id="learningProgressFrame" class="feature-iframe" title="Learning Progress"></iframe>
        <iframe id="skillRecommendationsFrame" class="feature-iframe" title="Next Best Skill"></iframe>
        <iframe id="chatFrame" class="feature-iframe" title="AI Assistant"></iframe>
      </div>
    </div>
  </div>

  <script>
    const proverbs = [
      "The beautiful thing about learning is that no one can take it away from you.",
      "Education is not the filling of a pail, but the lighting of a fire.",
      "Knowledge is power. Invest in yourself.",
      "The capacity to learn is a gift; the ability to learn is a skill; the willingness to learn is a choice.",
      "Education is the most powerful weapon which you can use to change the world.",
      "Learning never exhausts the mind.",
      "Your education is a dress rehearsal for a life that is yours to lead.",
      "The expert in anything was once a beginner.",
      "Knowledge is treasure, but practice is the key to it.",
      "Study with the intention of becoming better. That's real learning."
    ];

    const featureMap = {
      'student-profile': 'student-profile.html',
      'skill-intelligence': 'skill-intelligence.html',
      'courses': 'courses.html',
      'learning-roadmap': 'learning-roadmap.html',
      'learning-plan': 'learning-plan.html',
      'learning-progress': 'learning-progress.html',
      'skill-recommendations': 'skill-recommendations.html',
      'chat': 'chat.html'
    };

    const frameIdMap = {
      'student-profile': 'studentProfileFrame',
      'skill-intelligence': 'skillIntelligenceFrame',
      'courses': 'coursesFrame',
      'learning-roadmap': 'learningRoadmapFrame',
      'learning-plan': 'learningPlanFrame',
      'learning-progress': 'learningProgressFrame',
      'skill-recommendations': 'skillRecommendationsFrame',
      'chat': 'chatFrame'
    };

    // DOM Elements
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const sidebarClose = document.getElementById('sidebarClose');
    const logoutButton = document.getElementById('logoutButton');
    const menuItems = document.querySelectorAll('.menu-item');
    const welcomeSection = document.getElementById('welcomeSection');
    const userName = document.getElementById('userName');
    const statusMessage = document.getElementById('statusMessage');
    const proverb = document.getElementById('proverb');

    // State
    let authToken = localStorage.getItem('authToken');
    let currentSection = 'welcome';

    // Initialize
    function init() {
      if (!authToken) {
        window.location.href = 'index.html';
        return;
      }

      loadDashboard();
      setupEventListeners();
      setRandomProverb();
    }

    function setupEventListeners() {
      hamburger.addEventListener('click', toggleSidebar);
      sidebarClose.addEventListener('click', closeSidebar);
      logoutButton.addEventListener('click', logout);

      menuItems.forEach(item => {
        item.addEventListener('click', (e) => {
          const section = item.getAttribute('data-section');
          navigateToSection(section);
          closeSidebar();
        });
      });
    }

    function toggleSidebar() {
      sidebar.classList.toggle('open');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
    }

    function setRandomProverb() {
      proverb.textContent = `"${proverbs[Math.floor(Math.random() * proverbs.length)]}"`;
    }

    function navigateToSection(section) {
      // Update menu highlighting
      menuItems.forEach(item => {
        const itemSection = item.getAttribute('data-section');
        if (itemSection === section) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });

      // Hide welcome section
      welcomeSection.style.display = section === 'welcome' ? 'block' : 'none';

      // Hide all iframes
      document.querySelectorAll('.feature-iframe').forEach(frame => {
        frame.classList.remove('active');
      });

      currentSection = section;

      if (section !== 'welcome') {
        const frameId = frameIdMap[section] || (section + 'Frame');
        const frame = document.getElementById(frameId);
        
        if (frame) {
          frame.classList.add('active');
          
          // Load the feature page if not already loaded
          const featurePage = featureMap[section];
          if (featurePage && !frame.src) {
            const tokenParam = authToken ? `?token=${encodeURIComponent(authToken)}` : '';
            frame.src = featurePage + tokenParam;
          }
        }
      }

      // Scroll to top
      const contentArea = document.querySelector('.content-area');
      if (contentArea) {
        contentArea.scrollTop = 0;
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch('http://localhost:8001/me', {
          headers: { Authorization: `Bearer ${authToken}` }
        });

        if (!response.ok) throw new Error('Session expired');

        const data = await response.json();
        const firstName = data.full_name ? data.full_name.split(' ')[0] : 'Student';
        userName.textContent = `Welcome, ${firstName}`;
        statusMessage.textContent = 'You are signed in and authenticated successfully.';
        statusMessage.classList.remove('error');
      } catch (error) {
        statusMessage.textContent = 'Authentication failed. Please log in again.';
        statusMessage.classList.add('error');
        localStorage.removeItem('authToken');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      }
    }

    function logout() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
