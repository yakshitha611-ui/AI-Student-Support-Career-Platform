<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Next Best Skill | AI-Powered Student Support</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --primary: #7c3aed;
      --primary-soft: #ede9fe;
      --text: #0f172a;
      --muted: #475569;
      --border: #dfe7f4;
      --shadow: 0 12px 25px rgba(15, 23, 42, 0.08);
      --success: #166534;
      --warning: #b45309;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .topbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand { font-weight: 700; font-size: 1.1rem; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button {
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .button.ghost { background: #f8fafc; color: var(--text); border: 1px solid var(--border); }
    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem 3rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 1.4rem;
    }
    .card h2 { margin: 0 0 1rem; color: var(--primary); }
    .empty-state {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 2rem 1rem;
      color: var(--muted);
      background: #f8fafc;
      text-align: center;
    }
    .recs-list { display: grid; gap: 1rem; margin-top: 1rem; }
    .rec-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      background: #f8fafc;
    }
    .rec-item h4 { margin: 0 0 0.5rem; color: var(--primary); }
    .rec-detail { color: var(--muted); font-size: 0.9rem; margin: 0.3rem 0; }
    .priority-high { color: var(--danger); font-weight: 700; }
    .priority-medium { color: var(--warning); font-weight: 700; }
    .priority-low { color: #64748b; font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">AI-Powered Student Support</div>
    <div class="top-actions">
      <button class="button ghost" id="backToDashboardBtn" type="button">Dashboard</button>
      <button class="button ghost" id="logoutButton" type="button">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>🎯 Next Best Skill</h2>
      <p style="color: var(--muted); margin-top: 0;">Personalized skill recommendations based on your assessments and career goal.</p>

      <div id="recsContainer" style="margin-top: 2rem;">
        <div class="empty-state">Complete your skill assessment to get your next recommended skill.</div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = 'http://localhost:8001';

    function getAuthHeaders() {
      let token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
      
      if (!token) {
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token');
      }
      
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`,
      };
    }

    async function apiFetch(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { ...getAuthHeaders(), ...(options.headers || {}) },
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Request failed');
      return data;
    }

    function getPriorityClass(priority) {
      if (priority === 'High') return 'priority-high';
      if (priority === 'Medium') return 'priority-medium';
      return 'priority-low';
    }

    async function loadRecommendations() {
      try {
        const data = await apiFetch(`${API_BASE}/api/student/adaptive-recommendations`);
        const container = document.getElementById('recsContainer');

        if (!data.recommendations || data.recommendations.length === 0) {
          container.innerHTML = '<div class="empty-state">No recommendations available yet. Complete your skill assessment to get personalized recommendations.</div>';
          return;
        }

        container.innerHTML = '<div class="recs-list">' + data.recommendations.map(rec => `
          <div class="rec-item">
            <h4>${rec.skill}</h4>
            <div class="rec-detail"><strong>Priority:</strong> <span class="${getPriorityClass(rec.priority)}">${rec.priority}</span></div>
            <div class="rec-detail">${rec.why}</div>
          </div>
        `).join('') + '</div>';
      } catch (error) {
        document.getElementById('recsContainer').innerHTML = 
          '<div class="empty-state">Complete your skill assessment to get your next recommended skill.</div>';
      }
    }

    document.getElementById('backToDashboardBtn').addEventListener('click', () => {
      window.location.href = 'dashboard.html';
    });
    document.getElementById('logoutButton').addEventListener('click', () => {
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    });

    loadRecommendations();
  </script>
</body>
</html>
