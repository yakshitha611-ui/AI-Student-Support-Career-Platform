<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Student & Career Assistant | Student Support Platform</title>
    <style>
        * { 
            box-sizing: border-box; 
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fb;
            color: #122033;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #dfe7f4;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2563eb;
        }

        .logout-button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .logout-button:hover {
            background: #1d4ed8;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 60px);
            gap: 0;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #dfe7f4;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
        }

        .sidebar-header {
            padding: 1.5rem 1rem;
            border-bottom: 1px solid #dfe7f4;
        }

        .new-chat-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.3s ease;
        }

        .new-chat-btn:hover {
            background: #1d4ed8;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .chat-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.25rem;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            border: none;
            text-align: left;
            color: #64748b;
            transition: background 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-item:hover {
            background: #f1f5f9;
        }

        .chat-item.active {
            background: #e0e7ff;
            color: #2563eb;
            font-weight: 600;
        }

        .chat-item-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .chat-item-delete {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .chat-item-delete:hover {
            color: #ef4444;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid #dfe7f4;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .chat-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-header .emoji {
            font-size: 1.75rem;
        }

        .chat-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #f9fafb;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 1rem;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: #2563eb;
            color: white;
            border-radius: 12px 12px 0 12px;
        }

        .message.assistant .message-bubble {
            background: #e2e8f0;
            color: #122033;
            border-radius: 12px 12px 12px 0;
        }

        .message.assistant .message-bubble strong {
            color: #2563eb;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 1rem;
            color: #94a3b8;
        }

        .empty-state-emoji {
            font-size: 3rem;
        }

        .empty-state h2 {
            margin: 0;
            color: #64748b;
        }

        .empty-state p {
            margin: 0;
            font-size: 0.95rem;
        }

        /* Input Area */
        .chat-input-area {
            padding: 1.5rem;
            border-top: 1px solid #dfe7f4;
            background: white;
        }

        .input-form {
            display: flex;
            gap: 0.75rem;
        }

        .message-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #dfe7f4;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            transition: border-color 0.2s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .send-button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .send-button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .send-button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .context-badge {
            font-size: 0.8rem;
            background: #f0f4f8;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
            color: #64748b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #dfe7f4;
            }

            .main-container {
                flex-direction: column;
                height: auto;
            }

            .chat-area {
                height: calc(100vh - 260px);
            }

            .message-bubble {
                max-width: 85%;
            }

            .chat-list {
                display: none;
            }

            .sidebar-header {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                padding: 0.75rem 1rem;
            }

            .brand {
                font-size: 1rem;
            }

            .chat-header h1 {
                font-size: 1.25rem;
            }

            .message-bubble {
                max-width: 90%;
            }

            .messages-container {
                padding: 1rem;
                gap: 0.75rem;
            }

            .chat-input-area {
                padding: 1rem;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">🚀 AI Student & Career Assistant</div>
        <button class="logout-button" onclick="logout()">Logout</button>
    </div>

    <div class="main-container">
        <!-- Sidebar with Chat History -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
            </div>
            <div class="chat-list" id="chatList">
                <!-- Chat items will be loaded here -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <h1>
                    <span class="emoji">🤖</span>
                    AI Student & Career Assistant
                </h1>
                <p id="contextSummary">Loading your profile...</p>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <div class="empty-state-emoji">🎓</div>
                    <h2>Welcome to AI Assistant</h2>
                    <p>Ask me about your studies, skills, career, and learning path.</p>
                </div>
            </div>

            <div class="chat-input-area">
                <form class="input-form" onsubmit="sendMessage(event)">
                    <textarea 
                        class="message-input" 
                        id="messageInput"
                        placeholder="Ask about your career, skills, learning... (Shift+Enter for new line)"
                        rows="2"
                        onkeypress="handleEnter(event)"
                    ></textarea>
                    <button type="submit" class="send-button" id="sendBtn">
                        <span id="sendBtnText">Send</span>
                        <span id="sendBtnSpinner" class="hidden"><span class="loading-spinner"></span></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Constants
        const API_BASE = 'http://localhost:8001/api';
        let currentChatId = null;
        let accessToken = localStorage.getItem('authToken') || localStorage.getItem('access_token');
        
        // Check URL parameters for token (iframe usage)
        if (!accessToken) {
            const urlParams = new URLSearchParams(window.location.search);
            accessToken = urlParams.get('token');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            if (!accessToken) {
                window.location.href = 'index.html';
                return;
            }

            await loadChats();
            await loadStudentContext();
            
            // Auto-focus message input
            document.getElementById('messageInput').focus();
        });

        // Load student context and display summary
        async function loadStudentContext() {
            try {
                const response = await fetch(`${API_BASE}/chat/context`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                
                let contextText = data.summary || 'Profile loading...';
                document.getElementById('contextSummary').textContent = contextText;
            } catch (error) {
                console.error('Error loading context:', error);
                document.getElementById('contextSummary').textContent = 'Context loaded';
            }
        }

        // Load chat history
        async function loadChats() {
            try {
                const response = await fetch(`${API_BASE}/chat/list`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                renderChatList(data.chats || []);
            } catch (error) {
                console.error('Error loading chats:', error);
            }
        }

        // Render chat list
        function renderChatList(chats) {
            const chatList = document.getElementById('chatList');
            
            if (chats.length === 0) {
                chatList.innerHTML = '<div style="padding: 1rem; color: #94a3b8; text-align: center; font-size: 0.9rem;">No conversations yet</div>';
                return;
            }

            chatList.innerHTML = chats.map(chat => `
                <button 
                    class="chat-item ${chat.id === currentChatId ? 'active' : ''}"
                    data-chat-id="${chat.id}"
                    onclick="loadChat(${chat.id})"
                    title="${chat.title}"
                >
                    <span class="chat-item-title">${escapeHtml(chat.title)}</span>
                    <button 
                        class="chat-item-delete"
                        onclick="deleteChat(${chat.id}, event)"
                        title="Delete"
                    >×</button>
                </button>
            `).join('');
        }

        // Create new chat
        async function createNewChat() {
            try {
                const response = await fetch(`${API_BASE}/chat/new`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                currentChatId = data.id;
                
                // Clear messages and show empty state
                const container = document.getElementById('messagesContainer');
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-emoji">💬</div>
                        <h2>Start a Conversation</h2>
                        <p>Type your question below to begin.</p>
                    </div>
                `;
                
                await loadChats();
                document.getElementById('messageInput').focus();
            } catch (error) {
                alert('Error creating chat: ' + error.message);
            }
        }

        // Load chat and its messages
        async function loadChat(chatId) {
            try {
                currentChatId = chatId;
                const response = await fetch(`${API_BASE}/chat/${chatId}`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                
                renderMessages(data.messages || []);
                renderChatList((await fetch(`${API_BASE}/chat/list`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                }).then(r => r.json())).chats);
                
                // Update active chat indicator
                document.querySelectorAll('.chat-item').forEach(item => {
                    item.classList.toggle('active', Number(item.dataset.chatId) === Number(chatId));
                });
                
                document.getElementById('messageInput').focus();
            } catch (error) {
                alert('Error loading chat: ' + error.message);
            }
        }

        // Render messages
        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-emoji">💬</div>
                        <h2>Start a Conversation</h2>
                        <p>Type your question below to begin.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => `
                <div class="message ${msg.role}">
                    <div class="message-bubble">${formatMessage(msg.content)}</div>
                </div>
            `).join('');

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        // Format message with markdown-like formatting
        function formatMessage(text) {
            return escapeHtml(text)
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        // Send message
        async function sendMessage(event) {
            event.preventDefault();
            
            if (!currentChatId) {
                await createNewChat();
            }

            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Disable input while sending
            input.disabled = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            document.getElementById('sendBtnText').classList.add('hidden');
            document.getElementById('sendBtnSpinner').classList.remove('hidden');

            // Add user message to UI
            const container = document.getElementById('messagesContainer');
            if (container.innerHTML.includes('empty-state')) {
                container.innerHTML = '';
            }
            container.innerHTML += `
                <div class="message user">
                    <div class="message-bubble">${escapeHtml(message)}</div>
                </div>
            `;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                // Send to API
                const response = await fetch(`${API_BASE}/chat/${currentChatId}/message`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: message })
                });

                const data = await response.json();

                if (response.ok) {
                    // Add AI response
                    const aiResponse = data.ai_response.content;
                    container.innerHTML += `
                        <div class="message assistant">
                            <div class="message-bubble">${formatMessage(aiResponse)}</div>
                        </div>
                    `;
                    container.scrollTop = container.scrollHeight;
                } else {
                    container.innerHTML += `
                        <div class="message assistant">
                            <div class="message-bubble">Sorry, I couldn't process that. Please try again.</div>
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML += `
                    <div class="message assistant">
                        <div class="message-bubble">Network error. Please check your connection.</div>
                    </div>
                `;
            } finally {
                // Re-enable input
                input.disabled = false;
                sendBtn.disabled = false;
                document.getElementById('sendBtnText').classList.remove('hidden');
                document.getElementById('sendBtnSpinner').classList.add('hidden');
                input.focus();
            }
        }

        // Delete chat
        async function deleteChat(chatId, event) {
            event.stopPropagation();
            
            if (!confirm('Delete this conversation?')) return;

            try {
                await fetch(`${API_BASE}/chat/${chatId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (currentChatId === chatId) {
                    currentChatId = null;
                    document.getElementById('messagesContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-emoji">🎓</div>
                            <h2>Welcome to AI Assistant</h2>
                            <p>Ask me about your studies, skills, career, and learning path.</p>
                        </div>
                    `;
                }

                await loadChats();
            } catch (error) {
                alert('Error deleting chat: ' + error.message);
            }
        }

        // Handle Enter key
        function handleEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage(event);
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('access_token');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
