<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | AI-Powered Student Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --bg: #eef4ff;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #dfe7f4;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --success: #166534;
        --success-soft: #ecfdf5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #edf4ff 0%, #f7fbff 40%, #eef4ff 100%);
        color: var(--text);
        display: grid;
        place-items: center;
      }
      .register-card {
        width: min(100%, 460px);
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(148,163,184,0.18);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
        padding: 2rem 1.5rem;
      }
      .card-header {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .eyebrow {
        display: inline-block;
        padding: 0.38rem 0.7rem;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.08);
        color: var(--primary);
        font-size: 0.73rem;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 0.9rem 0 0.35rem;
        font-size: clamp(1.9rem, 3vw, 2.2rem);
        text-align: center;
      }
      .subtitle {
        margin: 0;
        text-align: center;
        color: var(--muted);
      }
      form {
        display: grid;
        gap: 1rem;
      }
      .field-group {
        display: grid;
        gap: 0.45rem;
      }
      label {
        font-size: 0.92rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f8fbff;
        color: var(--text);
        padding: 0.9rem 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      input::placeholder {
        color: #94a3b8;
      }
      input:focus {
        outline: none;
        border-color: rgba(37, 99, 235, 0.7);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        background: white;
      }
      input[aria-invalid="true"] {
        border-color: rgba(220, 38, 38, 0.6);
        background: #fff8f8;
      }
      .password-field {
        position: relative;
      }
      .password-field input {
        padding-right: 4.3rem;
      }
      .toggle-password {
        position: absolute;
        right: 0.7rem;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: var(--primary);
        font-weight: 600;
        padding: 0.35rem 0.5rem;
      }
      .toggle-password:hover,
      .toggle-password:focus-visible {
        color: var(--primary-dark);
        outline: none;
      }
      .error-message {
        min-height: 1rem;
        margin: 0;
        color: var(--danger);
        font-size: 0.8rem;
      }
      .form-message {
        display: none;
        padding: 0.8rem 0.9rem;
        border-radius: 12px;
        font-size: 0.88rem;
        font-weight: 500;
      }
      .form-message.visible {
        display: block;
      }
      .form-message.error {
        background: var(--danger-soft);
        border: 1px solid rgba(220, 38, 38, 0.18);
        color: #991b1b;
      }
      .form-message.success {
        background: var(--success-soft);
        border: 1px solid rgba(22, 101, 52, 0.12);
        color: var(--success);
      }
      .create-button {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
        color: white;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.95rem 1rem;
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.2);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .create-button:hover,
      .create-button:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(37, 99, 235, 0.25);
        outline: none;
      }
      .login-text {
        margin: 1.1rem 0 0;
        text-align: center;
        color: var(--muted);
        font-size: 0.94rem;
      }
      .login-text a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
      }
      .login-text a:hover,
      .login-text a:focus-visible {
        text-decoration: underline;
        outline: none;
      }
      @media (max-width: 520px) {
        .register-card {
          padding: 1.4rem 1rem 1.2rem;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="register-card">
      <div class="card-header">
        <span class="eyebrow">Welcome</span>
        <h1>Create Account</h1>
        <p class="subtitle">Register to continue your journey</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="field-group">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" autocomplete="name" aria-describedby="fullNameError" />
          <p class="error-message" id="fullNameError" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" aria-describedby="emailError" />
          <p class="error-message" id="emailError" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" aria-describedby="passwordError" />
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
          </div>
          <p class="error-message" id="passwordError" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-field">
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your password" autocomplete="new-password" aria-describedby="confirmPasswordError" />
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">Show</button>
          </div>
          <p class="error-message" id="confirmPasswordError" aria-live="polite"></p>
        </div>

        <div id="formMessage" class="form-message" role="alert" aria-live="assertive"></div>

        <button type="submit" class="create-button">Create Account</button>
      </form>

      <p class="login-text">Already have an account? <a href="index.html">Login</a></p>
    </main>

    <script>
      const form = document.getElementById('registerForm');
      const fullNameInput = document.getElementById('fullName');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const formMessage = document.getElementById('formMessage');

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function setFieldError(field, message) {
        const inputMap = {
          fullName: fullNameInput,
          email: emailInput,
          password: passwordInput,
          confirmPassword: confirmPasswordInput,
        };

        const errorMap = {
          fullName: document.getElementById('fullNameError'),
          email: document.getElementById('emailError'),
          password: document.getElementById('passwordError'),
          confirmPassword: document.getElementById('confirmPasswordError'),
        };

        const input = inputMap[field];
        const errorBox = errorMap[field];

        errorBox.textContent = message;
        input.setAttribute('aria-invalid', message ? 'true' : 'false');
      }

      function showMessage(message, type = 'error') {
        formMessage.textContent = message;
        formMessage.classList.remove('error', 'success', 'visible');
        formMessage.classList.add(type, 'visible');
      }

      function clearMessage() {
        formMessage.textContent = '';
        formMessage.classList.remove('error', 'success', 'visible');
      }

      function validateForm() {
        let isValid = true;

        if (!fullNameInput.value.trim()) {
          setFieldError('fullName', 'Full name is required.');
          isValid = false;
        } else {
          setFieldError('fullName', '');
        }

        if (!emailInput.value.trim()) {
          setFieldError('email', 'Email is required.');
          isValid = false;
        } else if (!emailPattern.test(emailInput.value.trim())) {
          setFieldError('email', 'Invalid email format.');
          isValid = false;
        } else {
          setFieldError('email', '');
        }

        if (!passwordInput.value.trim()) {
          setFieldError('password', 'Password is required.');
          isValid = false;
        } else if (passwordInput.value.length < 8) {
          setFieldError('password', 'Password must be at least 8 characters.');
          isValid = false;
        } else {
          setFieldError('password', '');
        }

        if (!confirmPasswordInput.value.trim()) {
          setFieldError('confirmPassword', 'Please confirm your password.');
          isValid = false;
        } else if (passwordInput.value !== confirmPasswordInput.value) {
          setFieldError('confirmPassword', 'Passwords do not match.');
          isValid = false;
        } else {
          setFieldError('confirmPassword', '');
        }

        return isValid;
      }

      document.querySelectorAll('.toggle-password').forEach((button) => {
        button.addEventListener('click', () => {
          const targetId = button.getAttribute('data-target');
          const input = document.getElementById(targetId);
          const isHidden = input.type === 'password';
          input.type = isHidden ? 'text' : 'password';
          button.textContent = isHidden ? 'Hide' : 'Show';
          button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearMessage();

        if (!validateForm()) {
          return;
        }

        const payload = {
          full_name: fullNameInput.value.trim(),
          email: emailInput.value.trim(),
          password: passwordInput.value,
        };

        try {
          const response = await fetch('http://localhost:8001/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            const message = result?.detail || result?.message || 'Unable to register at this time.';
            const friendlyMessage = /email|already|duplicate/i.test(String(message))
              ? 'This email is already registered.'
              : 'Registration failed. Please check your details and try again.';
            showMessage(friendlyMessage, 'error');
            return;
          }

          showMessage('Registration successful. Redirecting to Login...', 'success');

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);
        } catch (error) {
          showMessage('We could not complete registration right now. Please try again.', 'error');
        }
      });
    </script>
  </body>
</html>
