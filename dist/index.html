<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-Powered Student Support login page" />
    <title>AI-Powered Student Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-CQyaiFs_.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-row">
          <div class="brand-badge">AI</div>
          <div class="brand-copy">
            <h1>AI-Powered Student Support</h1>
            <p>Your personalized learning and career companion</p>
          </div>
        </div>
      </header>

      <main class="main-panel">
        <section class="login-card" aria-labelledby="login-title">
          <div class="card-header">
            <span class="eyebrow">Welcome</span>
            <h2 id="login-title">Welcome Back</h2>
            <p>Login to continue your journey</p>
          </div>

          <form id="loginForm" novalidate>
            <div class="field-group">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                aria-describedby="emailError"
              />
              <p class="error-message" id="emailError" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="password">Password</label>
              <div class="password-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  aria-describedby="passwordError"
                />
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                  Show
                </button>
              </div>
              <p class="error-message" id="passwordError" aria-live="polite"></p>
            </div>

            <div id="formError" class="form-error" role="alert" aria-live="assertive"></div>

            <button type="submit" class="login-button" id="loginButton">Login</button>
          </form>

          <p class="register-text">
            Don&apos;t have an account? <a href="register.html">Register</a>
          </p>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
