<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommended Courses | AI-Powered Student Support</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --text: #0f172a;
      --muted: #475569;
      --border: #dfe7f4;
      --shadow: 0 12px 25px rgba(15, 23, 42, 0.08);
      --success: #166534;
      --warning: #b45309;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .topbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand { font-weight: 700; font-size: 1.1rem; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button {
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .button.primary { background: var(--primary); color: white; }
    .button.ghost { background: #f8fafc; color: var(--text); border: 1px solid var(--border); }
    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem 3rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 1.4rem;
    }
    .card h2 { margin: 0 0 1rem; color: var(--primary); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .stat-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.4rem; }
    .value { font-size: 1.7rem; font-weight: 700; }
    .empty-state {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 2rem 1rem;
      color: var(--muted);
      background: #f8fafc;
      text-align: center;
    }
    .course-list { display: grid; gap: 1rem; margin-top: 1rem; }
    .course-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      background: #f8fafc;
    }
    .course-item h4 { margin: 0 0 0.5rem; }
    .course-detail { color: var(--muted); font-size: 0.9rem; margin: 0.3rem 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">AI-Powered Student Support</div>
    <div class="top-actions">
      <button class="button ghost" id="backToDashboardBtn" type="button">Dashboard</button>
      <button class="button ghost" id="logoutButton" type="button">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>📚 Recommended Courses</h2>
      <p style="color: var(--muted); margin-top: 0;">Personalized course recommendations based on your career goal and skill gaps.</p>
      
      <div class="grid" style="margin-top: 1.5rem;">
        <div class="stat-box">
          <div class="label">Career Goal</div>
          <div class="value" id="careerGoalValue" style="font-size: 1.3rem;">Not Set</div>
        </div>
        <div class="stat-box">
          <div class="label">Missing Skills</div>
          <div class="value" id="missingSkillsCount">0</div>
        </div>
        <div class="stat-box">
          <div class="label">Recommended Courses</div>
          <div class="value" id="courseCount">0</div>
        </div>
      </div>

      <div id="coursesContainer" style="margin-top: 2rem;">
        <div class="empty-state">No personalized courses yet.</div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = window.__API_BASE__ || 'http://ai-student-support-career-platform-4.onrender.com';

    function getAuthHeaders() {
      // Check localStorage, sessionStorage, and URL parameters for auth token
      let token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
      
      if (!token) {
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token');
      }
      
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`,
      };
    }

    async function apiFetch(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { ...getAuthHeaders(), ...(options.headers || {}) },
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Request failed');
      return data;
    }

    async function loadCourses() {
      try {
        const data = await apiFetch(`${API_BASE}/api/student/course-recommendations`);
        const container = document.getElementById('coursesContainer');
        
        document.getElementById('careerGoalValue').textContent = data.career_name || 'Not Set';
        document.getElementById('missingSkillsCount').textContent = (data.missing_skills || []).length;
        document.getElementById('courseCount').textContent = (data.recommendations || []).length;

        if (!data.recommendations || data.recommendations.length === 0) {
          container.innerHTML = '<div class="empty-state">No personalized courses yet. Complete your profile and career goal to get recommendations.</div>';
          return;
        }

        container.innerHTML = '<div class="course-list">' + data.recommendations.map(course => `
          <div class="course-item">
            <h4>${course.course_name}</h4>
            <div class="course-detail"><strong>Skill:</strong> ${course.skill}</div>
            <div class="course-detail"><strong>Level:</strong> ${course.difficulty}</div>
            <div class="course-detail"><strong>Priority:</strong> ${course.priority}</div>
            <div class="course-detail"><strong>Duration:</strong> ${course.estimated_time}</div>
            <div style="margin-top: 0.8rem; color: var(--muted); font-size: 0.85rem;">${course.why}</div>
          </div>
        `).join('') + '</div>';
      } catch (error) {
        document.getElementById('coursesContainer').innerHTML = 
          '<div class="empty-state">Unable to load courses. Complete your profile and career goal to get recommendations.</div>';
      }
    }

    document.getElementById('backToDashboardBtn').addEventListener('click', () => {
      window.location.href = 'dashboard.html';
    });
    document.getElementById('logoutButton').addEventListener('click', () => {
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    });

    loadCourses();
  </script>
</body>
</html>
